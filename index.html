<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Guide · 中文</title>
    <style>
        body {
            font-family: "Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",Arial,sans-serif;
            text-align: center;
            margin: 20px;
            line-height: 1.5;
        }
        .container { max-width: 600px; margin: auto; }
        .instruction { margin-bottom: 30px; font-size: 18px; font-weight: bold; }
        .hidden { display: none; }
        .display {
            font-size: 24px; border: 2px solid #007BFF; padding: 10px;
            width: 100%; max-width: 300px; margin: 0 auto 20px auto;
            text-align: center; border-radius: 5px;
        }
        .button-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .button {
            font-size: 20px; width: 60px; height: 60px; border: none; border-radius: 5px;
            background-color: #007BFF; color: white; cursor: pointer;
        }
        .button:hover { background-color: #0056b3; }
        .back-button { background-color: #FF0000; }
        .back-button:hover { background-color: #CC0000; }
        .play-button {
            font-size: 20px; width: 60px; height: 60px; border: none; border-radius: 5px;
            background-color: #28a745; color: white; cursor: pointer;
        }
        .play-button:hover { background-color: #218838; }
        .link-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .back-link {
            font-size: 16px; padding: 8px 16px; border: none; border-radius: 5px;
            background-color: #ffc107; color: black; text-decoration: none; cursor: pointer; height: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .back-link:hover { background-color: #e0a800; }
        #audio-title { font-size: 20px; font-weight: bold; margin: 20px 0; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <p id="instruction" class="instruction">
            亲爱的访客：在每个展厅，您都会看到数字，这些数字对应关于房间、展品及其历史背景的讲解。<br>
            请选择对应的编号，然后点击播放按钮。
        </p>

        <div id="display" class="display">0</div>
        <div id="audio-title">请选择一个编号</div>

        <audio id="audio-player" controls style="width: 100%; max-width: 600px; display: none; margin: 20px auto;" controlslist="nodownload">
            您的浏览器不支持音频播放器。
        </audio>

        <div class="button-container">
            <button class="button" onclick="addNumber(1)">1</button>
            <button class="button" onclick="addNumber(2)">2</button>
            <button class="button" onclick="addNumber(3)">3</button>
            <button class="button" onclick="addNumber(4)">4</button>
            <button class="button" onclick="addNumber(5)">5</button>
            <button class="button" onclick="addNumber(6)">6</button>
            <button class="button" onclick="addNumber(7)">7</button>
            <button class="button" onclick="addNumber(8)">8</button>
            <button class="button" onclick="addNumber(9)">9</button>
            <button class="button" onclick="addNumber(0)">0</button>
            <button class="button back-button" onclick="removeLast()">←</button>
            <button id="play-button" class="play-button" onclick="playAudio()">▶</button>
        </div>

        <div class="link-container">
            <a id="back-link" href="https://schlossmuseumwf.github.io/willkommen/" class="back-link">返回语言选择</a>
        </div>
    </div>

    <script>
        let currentNumber = '';

        // ⬇️ всегда zh + анти-кэш для titles.json
        const chosenLanguage = "zh";
        const titlesUrl = "https://schlossmuseumwf.github.io/audio/titles.json?v=" + Date.now();

        let titles = {};
        let titlesReady = false;

        fetch(titlesUrl)
            .then(response => response.json())
            .then(data => {
                titles = data || {};
                titlesReady = !!(titles[chosenLanguage]);
                console.log("titles.zh loaded:", titlesReady);
            })
            .catch(error => {
                console.error("加载 titles.json 时出错:", error);
            });

        function toggleHeader(show) {
            const instruction = document.getElementById('instruction');
            const audioTitle = document.getElementById('audio-title');
            if (show) {
                instruction.classList.remove('hidden');
                audioTitle.classList.remove('hidden');
            } else {
                instruction.classList.add('hidden');
                audioTitle.classList.add('hidden');
            }
        }

        function addNumber(num) {
            if (currentNumber.length < 5) {
                currentNumber += num;
                document.getElementById('display').textContent = currentNumber || '0';
                toggleHeader(false);
            }
        }

        function removeLast() {
            currentNumber = currentNumber.slice(0, -1);
            document.getElementById('display').textContent = currentNumber || '0';
            if (!currentNumber) toggleHeader(true);
        }

        function playAudio() {
            if (!currentNumber) {
                alert("请先输入编号，然后点击“播放”。");
                return;
            }

            const audioUrl = `https://schlossmuseumwf.github.io/audio/mp3/${chosenLanguage}/${currentNumber}.mp3`;
            const audioPlayer = document.getElementById('audio-player');
            const audioTitle = document.getElementById('audio-title');

            // Ключи в JSON — строки, но доступ по числу тоже сработает (JS приведёт к строке)
            const numericNumber = parseInt(currentNumber, 10);

            let title = null;
            if (titlesReady) {
                title = titles[chosenLanguage][numericNumber] ?? titles[chosenLanguage][currentNumber] ?? null;
            }

            if (title) {
                audioTitle.textContent = title;
                audioTitle.style.display = 'block';
            } else {
                audioTitle.textContent = `音频编号：${currentNumber}`;
            }

            audioPlayer.src = audioUrl;
            audioPlayer.style.display = 'block';
            audioPlayer.play();
        }
    </script>
</body>
</html>
